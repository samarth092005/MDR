_schema-version: '3.1'
ID: mdr-cap-btp
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: mdr-cap-btp-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: mdr-cap-btp-destination
      - name: mdr-cap-btp-db
      - name: mdr-cap-btp-auth

  - name: mdr-cap-btp-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: mdr-cap-btp-db

  - name: mdr-cap-btp-approuter
    type: approuter.nodejs
    path: app/
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    build-parameters:
      builder: custom
      commands:
        - npm install --prefix zmdr_bulkload --no-workspaces
        - npm run build --prefix zmdr_bulkload
        - rm -rf zmdr_bulkload/node_modules
    # properties:
    #   TENANT_HOST_PATTERN: "^(.*)\\.cfapps\\.eu30\\.hana\\.ondemand\\.com"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: mdr-cap-btp-auth

resources:
  - name: mdr-cap-btp-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: mdr-cap-manual-dest
  - name: mdr-cap-btp-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: mdr-cap-manual-hdi
  - name: mdr-cap-btp-auth
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: mdr-cap-manual-auth
