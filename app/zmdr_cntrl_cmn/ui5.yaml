# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: com.intapptics.zmdrcntrlcmn
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://cloud9.way2erp.us:8000
            client: '400'
          - url: http://cloud9.way2erp.us:8000
            client: '400'
            path: /sap/opu/odata/sap/ZMDGCPCNTRLVAL01_CDS/
          - url: http://cloud9.way2erp.us:8000
            client: '400'
            path: /sap/opu/odata/sap/ZMDR_UTILITY_WORKFLOW_SRV/
          - url: http://cloud9.way2erp.us:8000
            client: '400'
            # destination: ABAP
            path: /sap/opu/odata/sap/ZMDGCPCNTRLURL01_CDS/
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.intapptics.zmdrcntrlcmn
        ui5Theme: sap_horizon
