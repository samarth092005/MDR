<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Common Central App</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
        #ui5-splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f6f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            z-index: 99999;
            transition: opacity 0.25s ease;
        }
        .ui5-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #d1d5db;
            border-top-color: #0070f2;
            border-radius: 50%;
            animation: ui5spin 0.8s linear infinite;
        }
        @keyframes ui5spin {
            to { transform: rotate(360deg); }
        }
        .ui5-splash-text {
            margin-top: 16px;
            color: #32363a;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.148.1/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{
            "com.intapptics.zmdrcntrlcmn": "./"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div id="ui5-splash-screen">
        <div class="ui5-spinner"></div>
        <div class="ui5-splash-text">Loading Material Repository...</div>
    </div>
    <div
        data-sap-ui-component
        data-name="com.intapptics.zmdrcntrlcmn"
        data-id="container"
        data-settings='{"id" : "com.intapptics.zmdrcntrlcmn"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
